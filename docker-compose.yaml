x-gateway-common: &gateway-common
  build:
    context: .
    dockerfile: gateway/Dockerfile
  expose:
    - "8080"
  depends_on:
    consul:
      condition: service_healthy
  environment:
    CONSUL_ADDR: consul:8500

services:
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      product-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://product_user:product_password@postgres:5432/product_db?sslmode=disable
      REDIS_ADDR: redis:6379
    expose:
      - "50051"
    cpus: 0.50
    mem_limit: 512m

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

  gateway-1:
    <<: *gateway-common
    container_name: gateway-1
  gateway-2:
    <<: *gateway-common
    container_name: gateway-2
  gateway-3:
    <<: *gateway-common
    container_name: gateway-3

  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  product-migrations:
    build:
      context: ./migrations/product
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

global:
  scrape_interval: 15s


scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway-1:8080"]
        labels:
          instance: "gateway-1"

      - targets: ["gateway-2:8080"]
        labels:
          instance: "gateway-2"

      - targets: ["gateway-3:8080"]
        labels:
          instance: "gateway-3"
